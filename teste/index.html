<!-- MODO TESTE: lê a planilha real, mas o app NÃO grava nada nela. Para a versão de verdade, esta linha some. -->
<script>window.MODO_TESTE = true;</script>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.3.1",
    "react-dom": "https://esm.sh/react-dom@18.3.1?external=react",
    "react-dom/client": "https://esm.sh/react-dom@18.3.1/client?external=react",

  }
}
</script>
</head>
<body>
<div id="root"></div>
<script type="module" src="app.js?v=10.3"></script>
<script>
  // v9.5: guarda o app no celular (service worker) para abrir mesmo sem internet
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(function (e) { console.warn('service worker', e); });
    window.addEventListener('load', function () {
      setTimeout(function () {
        navigator.serviceWorker.ready.then(function (r) {
          var urls = performance.getEntriesByType('resource').map(function (e) { return e.name; });
          if (r.active) r.active.postMessage({ tipo: 'guardar', urls: urls });
        });
      }, 4000);
    });
  }
</script>
</body>
